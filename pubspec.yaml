name: go27q32_lite
description: Native DDC/CI control for the Gigabyte GO27Q32.
publish_to: none
version: 1.0.0+18

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  ffi: ^2.1.3
  win32: ^5.9.0
  window_manager: ^0.4.3
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/go27q32.png
    - assets/fonts/LICENSE.txt
  fonts:
    - family: HarmonyOS
      fonts:
        - asset: assets/fonts/HarmonyOS_Sans_SC_Regular.ttf
          weight: 400
        - asset: assets/fonts/HarmonyOS_Sans_SC_Medium.ttf
          weight: 500
