name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = ((Get-Content pubspec.yaml | Where-Object { $_ -match '^version:' }) -replace '^version:\s*','') -replace '\+.*$',''
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match pubspec.yaml.' }
      - name: Test and build Windows
        shell: pwsh
        run: ./build.ps1 -Flutter (Get-Command flutter).Source -Dotnet (Get-Command dotnet).Source
      - name: Compile bilingual installer
        shell: pwsh
        run: ./installer/build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/*-setup.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-checks
          path: dist/*/win-x64/desktop-checks.txt
          if-no-files-found: ignore

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > release-state.txt 2>/dev/null; then
            if [ "$(cat release-state.txt)" = "false" ]; then
              echo 'Release is already published; preserving existing assets.'
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "GO27Q32 Lite $RELEASE_TAG" --notes-file installer/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
